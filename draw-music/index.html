<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sister engineering line play | draw music</title><link rel="stylesheet" href="../lineplay/style.css"></head>
<body data-mode="music"><header class="site__header"><div class="header-row"><a class="nav_ac" href="../">sister engineering</a></div><div class="header-line"></div><nav class="header-row site-navigation" aria-label="Site navigation"><a class="nav_ac" href="../portfolio">experiments</a><a class="nav_ac" href="../contact">contact</a></nav><div class="header-line"></div></header>
<main><div class="page-heading"><h1>sister engineering line play</h1></div><section class="studio" aria-label="Drawing studio"><div class="toolbar"><div class="colors" aria-label="Ink color and sound"></div><span id="brushSound" class="brush-sound" aria-live="polite"></span><label>Brush <input id="brush" type="range" min="2" max="12" value="4" aria-label="Brush size"></label><div class="tools"><button id="undo">↶ Undo</button><button id="clear">Clear canvas</button><button id="save" aria-label="Save drawing as PNG">↓ Save</button></div></div>
<div class="canvas-wrap"><canvas id="canvas" aria-label="Draw with your mouse, pen, or finger"></canvas><span class="canvas-note" id="canvasNote">HIGH NOTES ↑<br><br>LOW NOTES ↓</span></div>
<div class="transport"><div class="modeControls" id="musicControls"><button class="primary" id="play">▶ Play drawing</button><div class="playback-switch" role="group" aria-label="Playback mode"><button id="scanMode" type="button" aria-pressed="true">Left to right</button><button id="followMode" type="button" aria-pressed="false">Follow lines</button><button id="continuousMode" type="button" aria-pressed="false">Continuous</button></div><label>Tempo <input id="tempo" type="range" min="50" max="200" value="90"><output id="tempoValue">90 BPM</output></label></div><span id="status" role="status">Ready when you are.</span></div></section>
<div class="below"><p id="hint"><span>↗</span> Draw higher for brighter notes. Draw lower for deeper ones.</p></div></main><script src="../lineplay/app.js"></script></body></html>
